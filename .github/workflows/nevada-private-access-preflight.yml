name: Nevada private-access preflight (no build)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nevada-private-access-preflight
  cancel-in-progress: false

jobs:
  verify-private-access:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify private repository token without exposing it
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PRIVATE_REPO_TOKEN:-}" ]; then
            echo "::error::PRIVATE_REPO_TOKEN is missing or unavailable to this workflow."
            exit 1
          fi

          API=https://api.github.com
          REPO=BalsacTheJew666/nevada-nethunter-baseline-xt2615
          HEADERS="$(mktemp)"
          BODY="$(mktemp)"
          trap 'rm -f "$HEADERS" "$BODY"' EXIT

          status="$(curl --silent --show-error --location \
            --output "$BODY" --dump-header "$HEADERS" \
            --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $PRIVATE_REPO_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$API/repos/$REPO")"

          if [ "$status" != 200 ]; then
            echo "::error::Private repository access check failed (HTTP $status). Token was not printed."
            exit 1
          fi

          python3 - "$BODY" <<'PY'
          import json, sys
          d=json.load(open(sys.argv[1]))
          if d.get("full_name","").lower() != "balsacthejew666/nevada-nethunter-baseline-xt2615":
              raise SystemExit("Unexpected repository identity")
          if d.get("private") is not True:
              raise SystemExit("Expected destination repository to be private")
          print("Private repository identity verified.")
          print("Private repository visibility verified.")
          print("Default branch:", d.get("default_branch", "(not reported)"))
          PY

          # Verify read access to a known, non-secret build input.
          status="$(curl --silent --show-error --location \
            --output "$BODY" --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $PRIVATE_REPO_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$API/repos/$REPO/contents/configs/nevada-stock.config.gz?ref=feature%2Fnethunter-staging")"
          if [ "$status" != 200 ]; then
            echo "::error::Token can read repository metadata but not the pinned stock config (HTTP $status)."
            exit 1
          fi
          echo "Private stock-config read access verified."
          echo "PREFLIGHT PASS — no checkout, build, artifact upload, or repository modification performed."
